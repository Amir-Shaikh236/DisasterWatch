version: '3.8'

services:
  backend:
    build: ./Backend

    ports: 
    - "5000:5000"

    environment:
    - PORT=5000
    - REDIS_URL=redis://redis:6379

    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

