name: Azure Continuous Deployment

on:
  workflow_run:
      workflows: ["CI Pipeline"]
      types: [completed]
      branches: [main]

permissions:
    id-token: write    # Required for Azure OIDC Authentication
    contents: read     # Grant read-only access to repo code

concurrency:
  group: cd-production            # Targets production deployment runs & Locks production deployments into a single queue.
  cancel-in-progress: false       # Prevent stopping a live deploy in the middle

jobs:
    deploy-frontend:
      if: github.event.workflow_run.conclusion == 'success'
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Build and Deploy Frontend
          uses: Azure/static-web-apps-deploy@v1
          with:
            azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }} # Very important to use the correct secret here, as this is the token that allows deployment to Azure Static Web Apps.
            repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for GitHub integrations (i.e., PR comments) and it will not be used for deployment.
            action: "upload"
            app_location: "frontend"
            output_location: "dist"
          env:
            VITE_API_URL: ${{ secrets.VITE_API_URL }} 
            VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
            VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
            VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

    deploy-azure:
        if: github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
            
            - name: Azure Login via OIDC
              uses: azure/login@v2
              with:
                client-id: ${{ secrets.AZURE_CLIENT_ID }}
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
              
            - name: log in to ACR
              run: az acr login --name DWatchRegistry

            - name: Build and Push Docker Image
              run: |
                docker build -t ${{ secrets.AZURE_CONTAINER_REGISTRY }}/backend:${{ github.sha }} ./Backend
                docker push ${{ secrets.AZURE_CONTAINER_REGISTRY }}/backend:${{ github.sha }}

            - name: Deploy to Azure Container Apps
              run: |
                az containerapp update \
                  --name disasterwatch-backend \
                  --resource-group disasterwatch-rg \
                  --image ${{ secrets.AZURE_CONTAINER_REGISTRY }}/backend:${{ github.sha }}

                  