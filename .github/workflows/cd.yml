
name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]

permissions:
      contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deployment
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  smoke-test:
      needs: deploy
      runs-on: ubuntu-latest
      timeout-minutes: 2
      steps:
      - name: Poll health endpoint until it returns 200
        run: |
          URL="https://disasterwatch-77t2.onrender.com/api/health"
          MAX_RETRIES=5
          SLEEP_INTERVAL=5
                
          for i in $(seq 1 $MAX_RETRIES); do
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" $URL)
            if [ "$STATUS_CODE" -eq 200 ]; then
              echo "Health check passed on attempt $i. Status code: $STATUS_CODE"
              exit 0
            fi
            echo "Attempt $i: Health check failed with status code $STATUS_CODE. Retrying in $SLEEP_INTERVAL seconds..."
            sleep $SLEEP_INTERVAL
          done

          echo "Health check failed after $MAX_RETRIES attempts. Exiting with failure."
          exit 1
            