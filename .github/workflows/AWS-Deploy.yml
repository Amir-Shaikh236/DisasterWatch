name: AWS Continuous Deployment

on:
  workflow_run:
      workflows: ["CI Pipeline"]
      types: [completed]
      branches: [main]

permissions:
    id-token: write    # Required for OIDC Authentication
    contents: read     # Grant read-only access to repo code

concurrency:
    group: cd-production            # Targets production deployment runs & Locks production deployments into a single queue.
    cancel-in-progress: false       # Prevent stopping a live deploy in the middle
    
jobs:
    Deploy-Backend-EC2:
        if: github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        # needs: Deploy-Frontend
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
                
            - name: Deploy to EC2 via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                host: ${{ secrets.AWS_EC2_HOST }}
                username: ubuntu
                key: ${{ secrets.AWS_EC2_SSH_KEY }}
                script: |
                    cd ~/disasterwatch
                    sudo docker compose up -d --build backend


