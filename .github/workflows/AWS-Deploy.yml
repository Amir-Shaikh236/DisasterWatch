name: AWS Continuous Deployment

on:
  workflow_run:
      workflows: ["CI Pipeline"]
      types: [completed]
      branches: [main]

permissions:
    id-token: write    # Required for OIDC Authentication
    contents: read     # Grant read-only access to repo code

concurrency:
  group: cd-production            # Targets production deployment runs & Locks production deployments into a single queue.
  cancel-in-progress: false       # Prevent stopping a live deploy in the middle

jobs:
    Deploy-Frontend:
      if: github.event.workflow_run.conclusion == 'success'
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: 'npm'
            cache-dependency-path: frontend/package-lock.json

        - name: Install Frontend Dependencies
          run: |
            cd frontend
            npm ci

        - name: Build and Deploy Frontend
          run: |
            cd frontend
            npm run build
          env:
            VITE_API_URL: ${{ secrets.VITE_API_URL }} 
            VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
            VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
            VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

        
        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id: ${{ secrets}}
            aws-secret-access-key: ${{secrets}}
            aws-region: ap-south-1

        - name: Upload Static Files to S3
          run: |
            aws s3 async frontend/dist s3://disasterwatch-frontend-static --delete

